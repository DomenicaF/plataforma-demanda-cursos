# Orquestación completa: MySQL + API (FastAPI) + Tablero (React/nginx).
# Uso:  docker compose up --build
# Tablero:  http://localhost:3000     API/docs:  http://localhost:8000/docs
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: plataforma_cursos
    ports:
      - "3307:3306"   # 3307 en el host para no chocar con MySQL local
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://root:rootpass@db:3306/plataforma_cursos
      SECRET_KEY: cambie-esta-clave-en-produccion
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
